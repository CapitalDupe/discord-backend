# Backend + Caddy (HTTPS on 443 only; port 80 is left alone for other apps).
# The backend is NOT published to the host: only Caddy can reach it.
services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      TRUST_PROXY: "1"   # exactly one proxy (Caddy) sits in front
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:-pondered.duckdns.org}
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
