services:
  - type: web
    name: discord-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SIGNUP_CODE
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: https://capitaldupe.github.io
      - key: TRUST_PROXY
        value: "1"
